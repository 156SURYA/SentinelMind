services:
  - type: web
    name: adaptive-sentinel-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn honeypot.app:app --host 0.0.0.0 --port 8000

  - type: web
    name: adaptive-sentinel-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
