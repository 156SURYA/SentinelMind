services:
  - type: web
    name: adaptive-sentinel-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13

  - type: web
    name: adaptive-sentinel-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: API_BASE_URL
        value: https://adaptive-sentinel-api.onrender.com